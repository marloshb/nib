<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIB Intelligence Hub — Plataforma Operacional e de Inteligência da Nova Indústria Brasil</title>
<link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
<script type="module" src="https://js.arcgis.com/5.1/"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#EEF2F7; --surface3:#E4EAF2;
  --line:#DCE3EC; --line2:#C6D2E0;
  --navy:#14345B; --navy-deep:#0B2038; --navy-mid:#122E4C;
  --tech:#176B9A; --tech-soft:#E6F0F7;
  --green:#168A69; --green-soft:#E4F2ED;
  --amber:#D5A932; --amber-soft:#FBF3DF;
  --orange:#D96B32; --orange-soft:#FBEDE4;
  --red:#C53D45; --red-soft:#FAE7E8;
  --ink:#0E1E33; --muted:#5A6B80; --faint:#8496A9;
  --ff-d:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --ff-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-m:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r:4px; --r2:6px;
  --sh:0 1px 2px rgba(11,32,56,.06), 0 10px 26px -18px rgba(11,32,56,.35);
  --sh2:0 18px 48px -20px rgba(11,32,56,.45);
  --side:236px; --top:58px; --sub:44px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ff-b);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C2CEDC;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#A9B8CA;background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--tech);outline-offset:1px}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr;height:100vh;transition:grid-template-columns .18s ease}
#shell.collapsed{--side:56px}
#topbar{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 14px 0 0;position:relative;z-index:60}
#brand{width:var(--side);min-width:var(--side);height:100%;display:flex;align-items:center;gap:9px;padding-left:14px;background:var(--navy-deep);color:#fff;transition:width .18s ease,min-width .18s ease}
.brand-mark{width:26px;height:26px;min-width:26px;border-radius:3px;background:linear-gradient(150deg,var(--tech),#0F4E75);display:grid;place-items:center;font-family:var(--ff-d);font-weight:700;font-size:13px;letter-spacing:.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.brand-txt{font-family:var(--ff-d);line-height:1.05;overflow:hidden;white-space:nowrap}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.4px}
.brand-txt span{display:block;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#8FB4CE}
#shell.collapsed .brand-txt{display:none}

.tb-sep{width:1px;height:26px;background:var(--line)}
.filters{display:flex;align-items:center;gap:7px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-left:14px}
.filters::-webkit-scrollbar{display:none}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 7px;height:29px;white-space:nowrap}
.fchip label{font-family:var(--ff-d);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.fchip select{border:none;background:none;font-size:12px;font-weight:500;max-width:150px;cursor:pointer;padding:0}
.tb-actions{display:flex;align-items:center;gap:8px}
.iconbtn{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--muted);position:relative}
.iconbtn:hover{border-color:var(--line2);color:var(--navy);background:var(--surface2)}
.iconbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:9px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:2px solid var(--surface);font-family:var(--ff-m)}
.askbtn{display:flex;align-items:center;gap:8px;height:30px;padding:0 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:12px;white-space:nowrap}
.askbtn:hover{border-color:var(--tech);color:var(--tech);background:var(--tech-soft)}
.askbtn kbd{font-family:var(--ff-m);font-size:9.5px;border:1px solid var(--line2);border-radius:3px;padding:1px 4px;background:#fff}
.live{display:flex;align-items:center;gap:6px;font-family:var(--ff-m);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);height:30px;padding:0 9px;background:var(--surface)}
.live b{color:var(--ink);font-weight:600}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(22,138,105,.6);animation:pl 2.2s infinite}
.pulse.off{background:var(--faint);animation:none;box-shadow:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(22,138,105,.55)}70%{box-shadow:0 0 0 7px rgba(22,138,105,0)}100%{box-shadow:0 0 0 0 rgba(22,138,105,0)}}
.user{display:flex;align-items:center;gap:8px;padding-left:4px}
.avatar{width:29px;height:29px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--ff-d);font-weight:600;font-size:12px}
.user-meta{line-height:1.15}
.user-meta b{font-size:11.5px;display:block}
.user-meta span{font-size:10px;color:var(--faint);font-family:var(--ff-d);letter-spacing:.5px;text-transform:uppercase}

/* ---------- sidebar ---------- */
#side{grid-column:1;grid-row:2;background:var(--navy-deep);color:#C9D8E6;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;border-right:1px solid #0A1B2E}
#side::-webkit-scrollbar-thumb{background:#1E3A56;background-clip:content-box}
.nav-group{padding:10px 0 2px}
.nav-title{font-family:var(--ff-d);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:#5C7B99;padding:0 14px 6px}
#shell.collapsed .nav-title{opacity:0;height:8px;padding:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12.5px;color:#B9CCDD;position:relative;white-space:nowrap;width:100%;text-align:left;border-left:2px solid transparent}
.nav-item:hover{background:#122C46;color:#fff}
.nav-item.active{background:linear-gradient(90deg,#16385A,#0E2843);color:#fff;border-left-color:var(--tech)}
.nav-item .ico{width:16px;min-width:16px;display:grid;place-items:center;opacity:.85}
.nav-item.active .ico{opacity:1;color:#5FB0DC}
.nav-item .cnt{margin-left:auto;font-family:var(--ff-m);font-size:9.5px;background:#1B3A57;color:#8FB6D4;border-radius:8px;padding:1px 6px}
.nav-item .cnt.crit{background:#4A1D22;color:#EE8F95}
#shell.collapsed .nav-item span.lbl,#shell.collapsed .nav-item .cnt{display:none}
.side-foot{margin-top:auto;padding:10px 12px;border-top:1px solid #16324C;font-family:var(--ff-m);font-size:10px;color:#5C7B99;line-height:1.7}
.side-foot .row{display:flex;justify-content:space-between;gap:6px}
#shell.collapsed .side-foot{display:none}

/* ---------- main ---------- */
#main{grid-column:2;grid-row:2;overflow:hidden;display:flex;flex-direction:column;min-width:0}
#subbar{height:var(--sub);min-height:var(--sub);border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 16px}
.crumb{font-family:var(--ff-d);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.crumb b{color:var(--navy);font-weight:600}
#viewTitle{font-family:var(--ff-d);font-size:17px;font-weight:600;letter-spacing:.2px;color:var(--navy)}
.subactions{margin-left:auto;display:flex;align-items:center;gap:7px}
#viewport{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 40px;position:relative}

/* ---------- primitives ---------- */
.grid{display:grid;gap:12px;min-width:0}
.grid > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative;z-index:0}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#FAFCFE);flex-wrap:wrap}
.card-h h3{margin:0;font-family:var(--ff-d);font-size:13.5px;font-weight:600;letter-spacing:.3px;color:var(--navy);min-width:0}
.card-h .sub{font-size:10.5px;color:var(--faint);font-family:var(--ff-m)}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.card-b{padding:12px;flex:1;min-height:0}
.card-b.tight{padding:0}
.eyebrow{font-family:var(--ff-d);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--ff-m)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.tiny{font-size:11px}
.right{text-align:right}
.strong{font-weight:600}
hr.sep{border:none;border-top:1px solid var(--line);margin:10px 0}

.btn{display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--surface2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#1B4373}
.btn.tech{background:var(--tech);border-color:var(--tech);color:#fff}
.btn.tech:hover{background:#1A7CB1}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--navy)}
.btn.sm{height:25px;padding:0 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;pointer-events:none}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--ff-d);font-size:10px;letter-spacing:.9px;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:3px;background:var(--surface2);color:var(--muted);border:1px solid transparent;white-space:nowrap}
.tag.b{background:var(--tech-soft);color:#0F5B87;border-color:#CBE2EF}
.tag.g{background:var(--green-soft);color:#0F6B52;border-color:#C9E5DB}
.tag.y{background:var(--amber-soft);color:#8E6D12;border-color:#EFE0B8}
.tag.o{background:var(--orange-soft);color:#A44D1D;border-color:#F0D6C5}
.tag.r{background:var(--red-soft);color:#93262D;border-color:#EFCBCE}
.tag.n{background:#EAF0F6;color:#3E5772;border-color:#D8E2EC}
.tag.mock{background:#F0ECFA;color:#5B45A3;border-color:#DCD3F2}
.dotm{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.dotm.beat{animation:beat 1.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tech)}
.kpi.r:before{background:var(--red)} .kpi.g:before{background:var(--green)} .kpi.y:before{background:var(--amber)} .kpi.o:before{background:var(--orange)} .kpi.n:before{background:var(--navy)}
.kpi .lab{font-family:var(--ff-d);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:5px}
.kpi .val{font-family:var(--ff-d);font-size:26px;font-weight:600;letter-spacing:-.3px;line-height:1.15;color:var(--navy);margin-top:1px;font-variant-numeric:tabular-nums}
.kpi .val.sm{font-size:21px}
.kpi .dlt{font-family:var(--ff-m);font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.kpi .spark{position:absolute;right:8px;bottom:6px;opacity:.55}
.kpi.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:#FFF6DC;box-shadow:0 0 0 2px rgba(213,169,50,.5)}100%{background:#fff;box-shadow:var(--sh)}}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{font-family:var(--ff-d);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);background:#FAFCFE;position:sticky;top:0;z-index:2;white-space:nowrap;cursor:pointer;user-select:none}
table.tbl th:hover{color:var(--tech)}
table.tbl td{padding:7px 10px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:#F3F8FC}
table.tbl tbody tr.sel{background:var(--tech-soft);box-shadow:inset 2px 0 0 var(--tech)}
.tblwrap{max-height:100%;overflow:auto}
.num{font-family:var(--ff-m);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* bars */
.bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;min-width:44px}
.bar > i{display:block;height:100%;background:var(--tech);border-radius:3px}
.mini{display:flex;align-items:center;gap:7px}

/* feed & logs */
.feed{overflow-y:auto;padding:2px 0}
.fitem{display:flex;gap:9px;padding:8px 12px;border-bottom:1px solid #EEF2F7;font-size:12px;position:relative}
.fitem:hover{background:#F7FAFD}
.fitem .t{font-family:var(--ff-m);font-size:10.5px;color:var(--faint);min-width:38px;padding-top:1px}
.fitem .bd{flex:1;min-width:0}
.fitem .bd b{font-weight:600}
.fitem .src{font-family:var(--ff-m);font-size:10px;color:var(--faint);margin-top:2px;display:block}
.fitem.new{animation:slidein .5s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-7px);background:#FFF6DC}to{opacity:1;transform:none}}
.fitem .rail{width:3px;border-radius:2px;background:var(--tech)}
.fitem.crit .rail{background:var(--red)} .fitem.warn .rail{background:var(--amber)} .fitem.ok .rail{background:var(--green)} .fitem.ag .rail{background:#6E4FBF}

.logbox{background:#0B2038;color:#B7CDE0;font-family:var(--ff-m);font-size:11px;line-height:1.65;padding:10px 12px;overflow-y:auto;height:100%}
.logbox .ln{white-space:pre-wrap;word-break:break-word}
.logbox .ts{color:#5C7B99}
.logbox .ag{color:#5FB0DC}
.logbox .ok{color:#4FC79E}
.logbox .wa{color:#E6C15F}
.logbox .er{color:#F08A90}
.logbox .di{color:#8FA8BF}
.logbox::-webkit-scrollbar-thumb{background:#23405D;background-clip:content-box}

/* map */
.map-slot{position:relative;background:var(--surface3);min-height:260px;overflow:hidden;isolation:isolate}
#geoHost{position:absolute;inset:0;display:none}
.map-overlay{position:absolute;z-index:5;pointer-events:none}
.map-legend{left:10px;bottom:10px;max-height:calc(100% - 20px);overflow:auto;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:11px;box-shadow:var(--sh);pointer-events:auto;max-width:210px}
.map-legend .eyebrow{margin-bottom:5px}
.lg{display:flex;align-items:center;gap:7px;padding:1.5px 0}
.lg i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.18)}
.lg i.sq{border-radius:2px}
.lg i.ln{width:14px;height:3px;border-radius:2px}
.map-layers{right:10px;top:10px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);pointer-events:auto;width:224px;max-width:calc(100% - 20px);max-height:calc(100% - 20px);overflow:hidden;display:flex;flex-direction:column}
.map-layers .hd{padding:7px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;background:#FAFCFE}
.map-layers .bd{flex:1;min-height:0;max-height:230px;overflow-y:auto;padding:3px 0}
.lyr{display:flex;align-items:center;gap:7px;padding:4px 9px;font-size:11.5px}
.lyr:hover{background:#F3F8FC}
.lyr input{accent-color:var(--tech);margin:0}
.lyr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-stat{left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 250px)}
.mchip{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:var(--r);padding:3px 8px;font-size:11px;box-shadow:var(--sh);pointer-events:auto;display:flex;align-items:center;gap:6px}
.mchip b{font-family:var(--ff-d);font-size:12px;color:var(--navy)}
.geo-fallback{position:absolute;inset:0;background:#DCE6EE;display:flex;align-items:center;justify-content:center}

/* context panel */
#ctx{position:fixed;top:var(--top);right:0;bottom:0;width:380px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh2);z-index:70;transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#ctx.open{transform:none}
.ctx-h{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;background:linear-gradient(180deg,#fff,#F8FBFD)}
.ctx-h h3{margin:0;font-family:var(--ff-d);font-size:16px;font-weight:600;color:var(--navy);line-height:1.2}
.ctx-b{flex:1;overflow-y:auto;padding:12px 14px}
.ctx-f{border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:7px;flex-wrap:wrap;background:#FAFCFE}
.kv{display:grid;grid-template-columns:118px 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--faint);font-family:var(--ff-d);font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding-top:1px}
.kv dd{margin:0;font-weight:500}
.sec{margin:14px 0 7px;font-family:var(--ff-d);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tech);border-bottom:1px solid var(--line);padding-bottom:4px}

/* toasts */
#toasts{position:fixed;right:14px;bottom:14px;z-index:200;display:flex;flex-direction:column;gap:8px;width:344px;max-width:92vw}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tech);border-radius:var(--r);box-shadow:var(--sh2);padding:9px 11px;animation:tin .34s cubic-bezier(.2,.9,.3,1)}
.toast.crit{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)} .toast.ok{border-left-color:var(--green)} .toast.ag{border-left-color:#6E4FBF}
.toast .th{display:flex;align-items:center;gap:7px;font-family:var(--ff-d);font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.toast .tt{font-weight:600;font-size:12.5px;margin-top:2px}
.toast .tb{font-size:11.5px;color:var(--muted);margin-top:2px}
.toast .ta{display:flex;gap:6px;margin-top:7px}
@keyframes tin{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .3s forwards}
@keyframes tout{to{opacity:0;transform:translateX(28px);height:0;padding:0;margin:0;border-width:0}}

/* modal */
#scrim{position:fixed;inset:0;background:rgba(11,32,56,.5);backdrop-filter:blur(2px);z-index:150;display:none;align-items:center;justify-content:center;padding:24px}
#scrim.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r2);box-shadow:0 40px 90px -30px rgba(11,32,56,.7);width:840px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:min .22s cubic-bezier(.2,.9,.3,1)}
.modal.wide{width:1080px}
.modal.slim{width:560px}

let _s = 20260812;
function rnd(){ _s = (_s*1664525 + 1013904223) % 4294967296; return _s/4294967296; }
function ri(a,b){ return Math.floor(rnd()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function pickw(a,w){ let t=w.reduce((x,y)=>x+y,0), r=rnd()*t; for(let i=0;i<a.length;i++){ r-=w[i]; if(r<=0) return a[i]; } return a[a.length-1]; }

const fmtBRL = v => v>=1e9 ? 'R$ '+(v/1e9).toFixed(1).replace('.',',')+' bi'

const CHAINS = CHAINS_RAW.map((c,i)=>({
  id:c[0], name:c[1], mission:c[2], dep:c[3], status:c[4],

/* ---------- Territórios ---------- */
const UFS = [
  ['SP','São Paulo',-23.55,-46.63,1.00],['MG','Minas Gerais',-19.92,-43.94,.72],['RJ','Rio de Janeiro',-22.91,-43.20,.61],

  const c = v/target>=1?'#168A69': v/target>.8?'#D5A932':'#D96B32';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:${W}px">
    <rect x="0" y="4" width="${W}" height="8" rx="4" fill="#E8EDF3"/>
    <rect x="0" y="4" width="${W*clamp(v/max,0,1)}" height="8" rx="4" fill="${c}"/>
    <line x1="${W*clamp(target/max,0,1)}" y1="1" x2="${W*clamp(target/max,0,1)}" y2="15" stroke="#14345B" stroke-width="2"/>
  </svg>`;
}
function spark(vals,o={}){
  const W=o.w||64,H=o.h||18,max=Math.max(...vals),min=Math.min(...vals);
  const pts=vals.map((v,i)=>`${W*i/(vals.length-1)},${H-2-(H-4)*((v-min)/((max-min)||1))}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px"><polyline points="${pts}" fill="none" stroke="${o.c||'#176B9A'}" stroke-width="1.5"/></svg>`;
}
/* grafo de relações — layout radial estável */
function chGraph(nodes,links,o={}){
  const W=o.w||620,H=o.h||360, cx=W/2, cy=H/2;
  const rings={0:0,1:H*0.28,2:H*0.44};
  const byRing={0:[],1:[],2:[]};
  nodes.forEach(n=> byRing[n.ring||1].push(n));
  const pos={};
  Object.keys(byRing).forEach(k=>{
    const arr=byRing[k], R=rings[k];
    arr.forEach((n,i)=>{
      const a = (i/(arr.length||1))*Math.PI*2 - Math.PI/2 + (k==='2'?0.24:0);
      pos[n.id]= k==='0' ? {x:cx,y:cy} : {x:cx+R*1.5*Math.cos(a), y:cy+R*Math.sin(a)};
    });
  });
  let g='';
  links.forEach(l=>{
    const a=pos[l.s],b=pos[l.t]; if(!a||!b) return;
    const mx=(a.x+b.x)/2+(b.y-a.y)*0.08, my=(a.y+b.y)/2-(b.x-a.x)*0.08;
    g+=`<path d="M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}" fill="none" stroke="${l.crit?'#C53D45':'#C6D2E0'}" stroke-width="${l.w||1.4}" opacity="${l.crit?.85:.7}" stroke-dasharray="${l.dash||''}"/>`;
  });
  nodes.forEach(n=>{
    const p=pos[n.id]; if(!p) return;
    const r=n.r||(n.ring===0?26:14);
    g+=`<g class="node" data-node="${esc(n.id)}"><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${n.c||'#176B9A'}" fill-opacity="${n.ring===0?1:.92}" stroke="#fff" stroke-width="2"/>`;
    if(n.crit) g+=`<circle cx="${p.x}" cy="${p.y}" r="${r+5}" fill="none" stroke="#C53D45" stroke-width="1.6" opacity=".8"><animate attributeName="r" values="${r+3};${r+10};${r+3}" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;0;.85" dur="2.2s" repeatCount="indefinite"/></circle>`;
    g+=`<text x="${p.x}" y="${p.y+r+11}" text-anchor="middle" style="font-size:9.5px;font-family:var(--ff-d);letter-spacing:.4px;fill:#3E5772">${esc(n.l.slice(0,20))}</text>`;
    if(n.sub) g+=`<text x="${p.x}" y="${p.y+3.5}" text-anchor="middle" style="font-size:9.5px;font-family:var(--ff-m);fill:#fff">${esc(n.sub)}</text>`;
    g+=`<title>${esc(n.tip||n.l)}</title></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:${W}px">${g}</svg>`;
}
function chTimeline(items,o={}){
  return `<div class="steps">${items.map((it,i)=>`<div class="step ${it.state||''}">
    <div class="mk">${it.state==='done'?'✓':i+1}</div>
    <div class="bd"><b>${esc(it.t)}</b><span>${esc(it.d||'')}</span>${it.m?`<span class="meta">${esc(it.m)}</span>`:''}</div></div>`).join('')}</div>`;
}

/* ============================================================
   MOTOR GEOESPACIAL — ArcGIS Maps SDK for JavaScript 5.1 (ESM)
   Uma única MapView é reposicionada entre módulos: a geografia
   é a camada integradora de toda a plataforma.
   Todos os serviços são públicos e dispensam chave de API.
   ============================================================ */
const ARCGIS_ONLINE = 'https://services.arcgisonline.com/ArcGIS/rest/services/';
const LIVING_ATLAS = 'https://services.arcgis.com/P3ePLMYs2RvChkJx/arcgis/rest/services/';

const GEO = {
  ready:false, view:null, map:null, layers:{}, mods:null, host:null, pulseTimer:null,
  mode:'loading', basemapId:'gray', _recreated:false,

  /* Basemaps abertos — serviços públicos, sem chave nem créditos */
  BASEMAPS:{
    gray:{n:'Esri · World Light Gray Canvas', url:ARCGIS_ONLINE+'Canvas/World_Light_Gray_Base/MapServer',
          ref:ARCGIS_ONLINE+'Canvas/World_Light_Gray_Reference/MapServer'},
    topo:{n:'Esri · World Topographic', url:ARCGIS_ONLINE+'World_Topo_Map/MapServer'},
    imagery:{n:'Esri · World Imagery', url:ARCGIS_ONLINE+'World_Imagery/MapServer',
             ref:ARCGIS_ONLINE+'Reference/World_Boundaries_and_Places/MapServer'},
    street:{n:'Esri · World Street Map', url:ARCGIS_ONLINE+'World_Street_Map/MapServer'},
    physical:{n:'Esri · World Physical Map', url:ARCGIS_ONLINE+'World_Physical_Map/MapServer'},
    osm:{n:'OpenStreetMap', osm:true}
  },

  MODULES:['@arcgis/core/config.js','@arcgis/core/Map.js','@arcgis/core/Basemap.js',
    '@arcgis/core/views/MapView.js','@arcgis/core/layers/FeatureLayer.js',
    '@arcgis/core/layers/GraphicsLayer.js','@arcgis/core/layers/TileLayer.js','@arcgis/core/Graphic.js'],

  init(){
    this.host = document.getElementById('geoHost');
    this.note('Carregando ArcGIS Maps SDK 5.1…');
    this.load().then(m=>{
      this.mods={esriConfig:m[0],Map:m[1],Basemap:m[2],MapView:m[3],FeatureLayer:m[4],
                 GraphicsLayer:m[5],TileLayer:m[6],Graphic:m[7]};
      this.build();
    }).catch(err=>{
      this.mode='error';
      this.note('Serviço geoespacial indisponível neste ambiente — <span class="mono">js.arcgis.com</span> não pôde ser carregado. Os demais módulos da plataforma seguem operando.');
      console.warn('ArcGIS SDK:',err);
      bus.emit('geo:ready');
    });
  },
  /* a 5.x é ESM e distribuída por um único CDN: os módulos vêm do
     carregador global $arcgis, publicado por js.arcgis.com/5.1/ */
  load(){
    const need=this.MODULES;
    return new Promise((res,rej)=>{
      let n=0, reinjected=false;
      const t=setInterval(()=>{
        if(window.$arcgis && window.$arcgis.import){
          clearInterval(t);
          Promise.resolve(window.$arcgis.import(need)).then(res,rej);
          return;
        }
        n++;
        // o <script type="module"> do head pode não ter sido executado:
        // uma reinjeção resolve casos de ordem de carregamento
        if(n===60 && !reinjected){
          reinjected=true;
          const s=document.createElement('script');
          s.type='module'; s.src='https://js.arcgis.com/5.1/';
          document.head.appendChild(s);
        }
        if(n>150){ clearInterval(t); rej(new Error('carregador $arcgis nao disponivel')); }
      },100);
    });
  },
  note(html){
    if(!this.host) return;
    this.host.innerHTML=`<div data-geo-note style="position:absolute;inset:0;display:grid;place-items:center;background:#DEE7EF;padding:18px">
      <div style="text-align:center;max-width:340px;font-size:12px;color:#5A6B80;line-height:1.6">
        <div style="width:24px;height:24px;margin:0 auto 10px;border:2px solid #B9CCDD;border-top-color:#176B9A;border-radius:50%;animation:spin 1s linear infinite"></div>
        ${html}</div></div>`;
  },
  sym(color,size,outline){ return {type:'simple-marker',style:'circle',color,size,outline:{color:outline||[255,255,255,.9],width:1}}; },
  openBasemap(id){
    const {Basemap,TileLayer}=this.mods, b=this.BASEMAPS[id]||this.BASEMAPS.gray;
    if(b.osm) return 'osm';
    const layers=[new TileLayer({url:b.url})];
    if(b.ref) layers.push(new TileLayer({url:b.ref}));
    return new Basemap({baseLayers:layers, title:b.n});
  },
  setBasemap(id){
    this.basemapId=id;
    if(!this.ready) return;
    try{ this.map.basemap=this.openBasemap(id); }catch(e){ console.warn(e); }

  makeView(center,zoom){
    const {MapView}=this.mods;
    if(this.host) this.host.innerHTML='';
    this.view = new MapView({
      container:this.host, map:this.map,
      center:center||[-52.5,-14.5], zoom:zoom||4,
      constraints:{minZoom:2,maxZoom:18,rotationEnabled:false}
    });
    this.view.when(()=>{
      this.ready=true; this.mode='arcgis';
      this.view.on('click', ev=>{
        this.view.hitTest(ev).then(r=>{
          const hit=(r.results||[]).filter(x=>x.graphic&&x.graphic.layer).map(x=>x.graphic)[0];
          if(!hit) return;
          const lid=hit.layer.id, a=hit.attributes||{};
          if(lid==='companies'&&a.id) openCompany(a.id);
          else if(lid==='projects'&&a.id) openProject(a.id);
          else if(lid==='alerts'&&a.id) openAlert(a.id);
          else if(lid==='territories'&&a.id) openTerritory(a.id);
          else if(lid==='inspections'&&a.id) openInspection(a.id);
        }).catch(()=>{});
      });
      this.startPulse();
      this.watchView();
      bus.emit('geo:ready');
    }, err=>{
      this.mode='error';
      this.note('Não foi possível inicializar o mapa neste ambiente.');
      console.warn('MapView:',err);
      bus.emit('geo:ready');
    });
  },
  watchView(){
    clearTimeout(this._watch);
    this._watch=setTimeout(()=>{
      if(this.mode!=='arcgis'||!this.view||!this.host||this.host.style.display==='none') return;
      const painted=this.host.querySelector('.esri-view, canvas');
      const sized=this.host.clientHeight>40 && this.host.clientWidth>40;
      if(!painted && sized && !this._recreated){
        this._recreated=true;
        const c=(this.view.center&&[this.view.center.longitude,this.view.center.latitude])||[-52.5,-14.5];
        const z=this.view.zoom||4;
        try{ this.view.destroy(); }catch(e){}
        this.view=null; this.makeView(c,z);
      }
    },1800);
  },

  /* a única MapView é remontada no quadro do módulo ativo */
  mount(slotId){
    const slot=document.getElementById(slotId);
    if(!slot||!this.host) return;
    if(this.host.parentElement!==slot) slot.appendChild(this.host);
    this.host.style.display='block';
    if(this.view){
      try{ if(this.view.container!==this.host) this.view.container=this.host; }catch(e){}
      this.watchView();
    }
  },
  park(){ if(this.host){ this.host.style.display='none'; document.body.appendChild(this.host); } },
  redraw(){},

  /* perfis de camada por módulo — a geografia se adapta ao contexto */
  profile(name){
    if(!this.ready) return;
    const P={
      torre:      {companies:1,projects:1,alerts:1,infra:0,territories:0,inspections:0,flows:0,la_hillshade:0,la_countries:0,la_admin:0,la_cities:0,la_transport:0},
      cadeias:    {companies:1,projects:0,alerts:1,infra:1,territories:0,inspections:0,flows:1,la_hillshade:0,la_countries:1,la_admin:0,la_cities:0,la_transport:0},
      empresas:   {companies:1,projects:0,alerts:0,infra:1,territories:0,inspections:0,flows:0,la_hillshade:0,la_countries:0,la_admin:1,la_cities:1,la_transport:1},
      comercio:   {companies:0,projects:0,alerts:0,infra:1,territories:0,inspections:0,flows:1,la_hillshade:0,la_countries:1,la_admin:0,la_cities:1,la_transport:0},
      territorial:{companies:1,projects:0,alerts:0,infra:1,territories:1,inspections:0,flows:0,la_hillshade:1,la_countries:0,la_admin:1,la_cities:1,la_transport:1},
      pipeline:   {companies:0,projects:1,alerts:0,infra:1,territories:0,inspections:0,flows:0,la_hillshade:0,la_countries:0,la_admin:1,la_cities:0,la_transport:0},
      riscos:     {companies:1,projects:1,alerts:1,infra:1,territories:0,inspections:0,flows:0,la_hillshade:1,la_countries:0,la_admin:1,la_cities:0,la_transport:0},
      casos:      {companies:0,projects:1,alerts:1,infra:0,territories:0,inspections:1,flows:0,la_hillshade:0,la_countries:0,la_admin:1,la_cities:0,la_transport:1},
      resultados: {companies:0,projects:1,alerts:0,infra:0,territories:0,inspections:1,flows:0,la_hillshade:0,la_countries:0,la_admin:1,la_cities:0,la_transport:0}
    }[name]||{};
    Object.keys(P).forEach(k=>{ if(this.layers[k]) this.layers[k].visible=!!P[k]; });
    bus.emit('geo:layers');
  },
  goTo(t,zoom){
    if(!this.ready||!this.view) return;
    try{ const p=this.view.goTo({center:[t.lng,t.lat],zoom:zoom||8},{duration:900}); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  },
  brasil(){
    if(!this.ready||!this.view) return;
    try{ const p=this.view.goTo({center:[-52.5,-14.5],zoom:4},{duration:800}); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  },
  clearHighlight(){ if(this.layers.highlight) this.layers.highlight.removeAll(); },
  mark(o,color,label){
    if(!this.ready||!this.mods) return;
    const {Graphic}=this.mods;
    this.layers.highlight.add(new Graphic({
      geometry:{type:'point',longitude:o.lng,latitude:o.lat},
      symbol:{type:'simple-marker',style:'circle',color:[0,0,0,0],size:26,outline:{color:color||[23,107,154,1],width:3}}
    }));
    if(label) this.layers.highlight.add(new Graphic({
      geometry:{type:'point',longitude:o.lng,latitude:o.lat},
      symbol:{type:'text',color:'#14345B',haloColor:'#fff',haloSize:2,text:label,yoffset:16,
        font:{size:10,weight:'bold',family:'sans-serif'}}
    }));
  },
  ring(o,radiusDeg,color){
    if(!this.ready||!this.mods) return;
    const {Graphic}=this.mods, pts=[];
    for(let i=0;i<=48;i++){ const a=i/48*Math.PI*2;
      pts.push([o.lng+radiusDeg*Math.cos(a)/Math.cos(o.lat*Math.PI/180), o.lat+radiusDeg*Math.sin(a)]); }
    this.layers.highlight.add(new Graphic({geometry:{type:'polygon',rings:[pts]},
      symbol:{type:'simple-fill',color:color||[197,61,69,.10],outline:{color:color||[197,61,69,.6],width:1.4,style:'dash'}}}));
  },
  pulseAt(o){
    if(!this.ready||!this.mods) return;
    const {Graphic}=this.mods, lyr=this.layers.pulse;
    const g=new Graphic({geometry:{type:'point',longitude:o.lng,latitude:o.lat},
      symbol:{type:'simple-marker',style:'circle',color:[197,61,69,.28],size:8,outline:{color:[197,61,69,.9],width:2}}});
    lyr.add(g); let s=8,up=true,n=0;
    const t=setInterval(()=>{
      s+=up?4:-4; if(s>34) up=false; if(s<8) up=true; n++;
      try{ const sym=g.symbol.clone(); sym.size=s; sym.color=[197,61,69,Math.max(.05,.35-s/120)]; g.symbol=sym; }catch(e){}
      if(n>60){ clearInterval(t); lyr.remove(g); }
    },70);
  },
  startPulse(){
    if(this.pulseTimer) clearInterval(this.pulseTimer);
    this.pulseTimer=setInterval(()=>{
      if(!state.live||!this.layers.alerts||!this.layers.alerts.visible) return;
      const crit=alerts.filter(a=>a.sev==='crit'&&a.open);
      if(crit.length) this.pulseAt(crit[Math.floor(Math.random()*crit.length)]);
    },9000);
  }
};

/* seletores derivados do estado global (RF-01) */
const F = () => state.filters;
function fProjects(){ const f=F(); return projects.filter(p=>
  (f.mission==='*'||p.mission===f.mission) && (f.chain==='*'||p.chain===f.chain) && (f.uf==='*'||p.uf===f.uf)); }
function fCompanies(){ const f=F(); return companies.filter(c=>
  (f.mission==='*'||c.mission===f.mission) && (f.chain==='*'||c.chain===f.chain) && (f.uf==='*'||c.uf===f.uf)); }
function fAlerts(){ const f=F(); return alerts.filter(a=> a.open &&
  (f.mission==='*'||a.mission===f.mission) && (f.chain==='*'||a.chain===f.chain) && (f.uf==='*'||a.uf===f.uf) &&
  (f.status==='*'||a.sev===f.status)); }
function fChains(){ const f=F(); return CHAINS.filter(c=> (f.mission==='*'||c.mission===f.mission) && (f.chain==='*'||c.id===f.chain)); }
function fCases(){ const f=F(); return cases.filter(c=> (f.chain==='*'||c.chain===f.chain) && (f.uf==='*'||c.uf===f.uf)); }
function filterLabel(){
  const f=F(), p=[];
  if(f.mission!=='*') p.push(MISSION_BY[f.mission].n);
  if(f.chain!=='*') p.push(CHAIN_BY[f.chain].name);
  if(f.uf!=='*') p.push(f.uf);
  return p.length? p.join(' · ') : 'Brasil · todas as missões';
}

function chainGraph(ch){
  const firms = companies.filter(c=>c.chain===ch.id).slice(0,7);
  const t = trade.find(x=>x.chain===ch.id);
  const nodes=[{id:'core',l:ch.name,ring:0,c:SEVC[ch.status],sub:ch.dep+'%',tip:`Dependência externa ${ch.dep}%`}];
  const links=[];
  const elos=[['Insumos críticos','#D96B32'],['Componentes','#C53D45'],['Manufatura','#176B9A'],['Integração e testes','#14345B'],['Distribuição','#168A69'],['P&D e certificação','#6E4FBF']];
  elos.forEach((e,i)=>{
    const nid='e'+i;
    const crit = i<2 && ch.dep>60;
    nodes.push({id:nid,l:e[0],ring:1,c:e[1],r:16,crit,tip:e[0]});
    links.push({s:'core',t:nid,w:2.2,crit});
  });
  firms.forEach((f,i)=>{
    nodes.push({id:f.id,l:f.name.split(' ').slice(0,2).join(' '),ring:2,c:'#3E8FBF',r:9,tip:`${f.name} · ${f.uf}`});
    links.push({s:'e'+(i%6),t:f.id,w:1.2});
  });
  if(t) t.orig.slice(0,3).forEach((o,i)=>{
    nodes.push({id:'p'+i,l:o.name+' '+o.share+'%',ring:2,c:o.share>55?'#C53D45':'#D5A932',r:11,crit:o.share>55,tip:`Origem: ${o.name} — ${o.share}% do fornecimento`});
    links.push({s:'e0',t:'p'+i,w:1+o.share/25,crit:o.share>55,dash:'4 3'});
  });
  return chGraph(nodes,links,{h:370});
}

  T.forEach(t=> t.orig.forEach(o=> byCountry[o.name]=(byCountry[o.name]||0)+t.value*o.share/100));

  <div class="kpis" style="margin-bottom:12px">
    ${kpi('Produtos críticos monitorados',T.length,'NCMs com relevância estratégica','n')}
    ${kpi('Valor importado exposto',fmtBRL(sum(T.map(t=>t.value))),'12 meses · fonte SECEX MOCK','o')}

    ${kpi('Substituibilidade média',Math.round(sum(T.map(t=>t.sub))/(T.length||1))+'%','potencial de nacionalização','g')}

      {tight:true,right:`<button class="btn sm" id="btnWorld">Enquadrar mundo</button>`})}

      +`<div class="sec">Origens dominantes</div>`
      +chBar(cty.map(([k,v],i)=>({l:k.split(' ')[0],v:v/1e9,c:i===0?'#C53D45':'#176B9A'})),{h:150,fmt:v=>v.toFixed(1),cut:8}))}

        <th>Produto</th><th>NCM</th><th>Cadeia</th><th>Valor importado</th><th>Origens</th><th>HHI</th><th>Prod. doméstica</th><th>Lead time</th><th>Substituib.</th><th>Score</th><th></th></tr></thead>

        <td class="tiny">${esc(CHAIN_BY[t.chain].name)}</td>

        <td class="tiny">${t.orig.map(o=>`${esc(o.name)} <b class="mono">${o.share}%</b>`).join(' · ')}</td>

const WLAB={energia:'Energia firme',agua:'Disponibilidade hídrica',gas:'Gás natural',logistica:'Logística e portos',
  fornec:'Fornecedores locais',mo:'Mão de obra qualificada',ict:'ICTs e universidades',mercado:'Mercado consumidor',ambiental:'Restrições ambientais'};
function scoreTerritories(){
  const w=state.weights, tw=sum(Object.values(w))||1;
  territories.forEach(t=>{
    t.score = Math.round(Object.keys(w).reduce((s,k)=> s+(t[k]||0)*w[k],0)/tw);
    t.cls = t.score>=74?'A':t.score>=64?'B':t.score>=52?'C':'D';
    t.gaps = Object.keys(w).filter(k=> t[k]<48).map(k=>WLAB[k]);
  });
  territories.sort((a,b)=>b.score-a.score);
  if(GEO.ready && GEO.layers.territories && GEO.layers.territories.queryFeatures){
    const l=GEO.layers.territories;
    l.queryFeatures().then(res=>{
      const upd=res.features.map(f=>{ const t=territories.find(x=>x.id===f.attributes.id);
        if(t){ f.attributes.score=t.score; f.attributes.cls=t.cls; } return f; });
      l.applyEdits({updateFeatures:upd}).catch(()=>{});
    }).catch(()=>{});
  }
}

  const i=STAGES.indexOf(p.stage);
  if(i>=STAGES.length-1){ toast('info','Projeto concluído','O projeto já se encontra no estágio de resultado.'); return; }
  const old=p.stage; p.stage=STAGES[i+1]; p.__new=true; p.maturity=Math.min(99,p.maturity+8);
  if(p.stage==='Execução' && !p.prog) p.prog=ri(3,12);
  pushEvent({type:'EVENT_PROJECT_UPDATE',title:`Projeto ${p.id} avançou para <b>${p.stage}</b>`,
    body:`${esc(p.name)} · ${old} → ${p.stage}`,cls:'ok',src:`Workflow Manager · ${p.uf}`});
  toast('ok','Estágio atualizado',`${p.id} agora está em <b>${p.stage}</b>. KPIs, relatórios e mapa foram recalculados.`);
  if(p.stage==='Financiamento') setTimeout(()=>runAgent('ag-instr',{project:p.id}),700);
  render(); openProject(pid);
}

function matchInstruments(p){
  return instruments.map(i=>{
    let s=40, why=[];
    if(p.capex/1e6 >= i.minCapex/1e6){ s+=14; why.push('porte do investimento compatível'); }
    if(i.stages.includes(p.stage)){ s+=12; why.push('estágio elegível ('+p.stage+')'); }
    if(/BNDES|Finep/.test(i.org) && p.capex>400e6){ s+=10; why.push('escala adequada à linha'); }
    if(/Clima|Hidrogênio|MOVER|Amazônia/.test(i.name) && p.co2red>80){ s+=16; why.push('impacto de descarbonização comprovável'); }
    if(/PADIS|EMBRAPII|Lei do Bem|Startups|FNDCT/.test(i.name) && CHAIN_BY[p.chain].mission==='M4'){ s+=15; why.push('conteúdo tecnológico da missão digital'); }
    if(/SUS|PDP|defesa|PED/i.test(i.name) && ['M2','M6'].includes(p.mission)){ s+=18; why.push('vinculação direta à missão'); }
    if(/Compras|margem/i.test(i.name) && p.imports>40){ s+=12; why.push('substituição de importações relevante'); }
    if(/Finame|Máquinas/i.test(i.name) && p.kind==='Modernização e digitalização'){ s+=10; why.push('aquisição de máquinas'); }
    s = Math.min(98, s + Math.round(p.priority/12));
    return {i, score:s, why, docs:['Projeto técnico','Certidões fiscais e trabalhistas','Licença ambiental','Comprovação de contrapartida','Cronograma físico-financeiro'].slice(0,ri(3,5))};
  }).sort((a,b)=>b.score-a.score);
}

      ${card('Efetividade dos instrumentos','execução orçamentária · MOCK',
        chBar(instruments.slice(0,6).map(i=>({l:i.id,v:Math.round(i.used*100)})),{h:150,fmt:v=>v+'%',cut:4}))}

  <div class="grid" style="margin-top:12px">
    ${card('Catálogo de instrumentos','regras de elegibilidade cadastradas no motor',
      `<div class="tblwrap" style="max-height:300px"><table class="tbl"><thead><tr>
        <th>Instrumento</th><th>Tipo</th><th>Instituição</th><th>Orçamento</th><th>Finalidade</th><th>CAPEX mínimo</th><th>Execução</th><th>TAT</th></tr></thead>
      <tbody>${instruments.map(i=>`<tr data-instr="${i.id}">

        <td class="num">${fmtBRL(i.minCapex)}</td>
        <td><div class="mini"><div class="bar" style="width:56px"><i style="width:${i.used*100}%"></i></div><span class="mono tiny">${Math.round(i.used*100)}%</span></div></td>

   em mapa, KPIs, agentes, alertas, workflow e relatórios.

function pushEvent(e){
  const ev = Object.assign({t:nowHM(),fresh:true,type:'EVENT'},e);
  state.events.unshift(ev);
  if(state.events.length>200) state.events.pop();
  bus.emit('event',ev);
  renderFeed();
  return ev;
}
function log(agent,msg,cls){
  state.logs.unshift({t:nowHMS(),a:agent,m:cls?`<span class="${cls}">${msg}</span>`:msg});
  if(state.logs.length>300) state.logs.pop();
  renderAgentLog();
}

/* ============================================================
   MOTOR DE AGENTES — execução observável passo a passo
   ============================================================ */
function runAgent(aid,ctxObj){
  const a=AGENTS.find(x=>x.id===aid); if(!a || a.running) return;
  a.running=true; a.state='Analisando'; a.now=a.load();
  const card=$('#ag-card-'+a.id); if(card) card.classList.add('running');
  const st=$('#ag-state-'+a.id); if(st) st.textContent='Executando';
  log(a.ini.toLowerCase(),`execução iniciada — ${fmtN(a.now)} ${a.unit} em avaliação`,'ag');
  const t=toast('ag',a.name,'Iniciando execução…',`<div class="bar" style="width:100%;margin-top:2px"><i id="tprog-${a.id}" style="width:0%;background:#6E4FBF;transition:width .5s"></i></div>`,14000);
  let i=0;
  const iv=setInterval(()=>{
    const pct=Math.round((i+1)/a.steps.length*100);
    const pr=$('#ag-prog-'+a.id); if(pr) pr.style.width=pct+'%';
    const tp=$('#tprog-'+a.id); if(tp) tp.style.width=pct+'%';
    const tb=t.querySelector('.tb'); if(tb) tb.textContent=`${i+1}/${a.steps.length} · ${a.steps[i]}`;
    log(a.ini.toLowerCase(),`[${i+1}/${a.steps.length}] ${a.steps[i]}`,i===a.steps.length-1?'ok':null);
    i++;
    if(i>=a.steps.length){
      clearInterval(iv);
      a.running=false; a.state='Ativo'; a.runs+=1;
      if(card) card.classList.remove('running');
      if(st) st.textContent='Ativo';
      setTimeout(()=>{ const pr2=$('#ag-prog-'+a.id); if(pr2) pr2.style.width='0%'; },900);
      agentOutput(a,ctxObj||{});
    }
  }, 900);
}

    case 'ag-supply': {

function demoPanel(){
  modal('Roteiro de demonstração','Ciclo ponta a ponta — da detecção ao resultado comprovado',`
    <div class="notice" style="margin-bottom:12px"><div>Um componente estratégico apresenta elevada dependência externa. O roteiro conduz o problema até uma decisão e um resultado monitorável, mostrando toda a plataforma reagindo de forma sincronizada.</div></div>
    <div id="demoSteps">${chTimeline(DEMO.map((s,i)=>({t:`${String(i+1).padStart(2,'0')} · ${s.t}`,d:s.d,m:VIEW_META[s.m]?VIEW_META[s.m][0]:'',state:i<state.demoStep?'done':i===state.demoStep?'act':''})))}</div>`,
    `<button class="btn" onclick="modalClose()">Fechar</button>
     <button class="btn" id="demoReset">Reiniciar</button>
     <button class="btn tech" id="demoStep">Avançar uma etapa</button>
     <button class="btn primary" id="demoPlay">${state.demoRunning?'Pausar':'Executar roteiro'}</button>`,'wide');
  $('#demoPlay').onclick=()=>{ modalClose(); state.demoRunning? stopDemo() : playDemo(); };
  $('#demoStep').onclick=()=>{ modalClose(); stepDemo(); };
  $('#demoReset').onclick=()=>{ state.demoStep=0; modalClose(); toast('info','Roteiro reiniciado','O ciclo pode ser executado novamente do início.'); };
}
let demoTimer=null;
function stepDemo(){
  if(state.demoStep>=DEMO.length){ state.demoStep=0; }
  const s=DEMO[state.demoStep];
  try{ s.run(); }catch(e){ console.warn(e); }
  go(s.m);
  const badge=$('#demoBadge');
  if(badge){ badge.innerHTML=`<b>${String(state.demoStep+1).padStart(2,'0')}/${DEMO.length}</b> ${esc(s.t)}`; }
  state.demoStep++;
  if(state.demoStep>=DEMO.length){
    stopDemo();
    setTimeout(()=>toast('ok','Roteiro concluído','Ciclo completo demonstrado: detecção, análise, decisão, execução, vistoria, resultado e evidência.'),1200);
  }
}
function playDemo(){
  state.demoRunning=true;
  $('#btnDemo').classList.add('on');
  showDemoBadge();
  stepDemo();
  demoTimer=setInterval(()=>{ if(!state.demoRunning){ clearInterval(demoTimer); return; } stepDemo(); }, 5200);
}
function stopDemo(){
  state.demoRunning=false; if(demoTimer) clearInterval(demoTimer);
  $('#btnDemo').classList.remove('on');
  const b=$('#demoBadge'); if(b) b.remove();
}
function showDemoBadge(){
  if($('#demoBadge')) return;
  const d=document.createElement('div');
  d.id='demoBadge';
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:190;background:var(--navy-deep);color:#fff;border-radius:20px;padding:7px 16px;font-family:var(--ff-d);font-size:12px;letter-spacing:.6px;box-shadow:var(--sh2);display:flex;gap:8px;align-items:center';
  d.innerHTML='<b>00/15</b> iniciando…';
  const stop=document.createElement('button');
  stop.textContent='parar'; stop.className='btn sm'; stop.style.cssText='margin-left:8px;background:#1E3A56;border-color:#2A4E70;color:#fff';
  stop.onclick=stopDemo; d.appendChild(stop);
  document.body.appendChild(d);
}

/* ============================================================
   PERGUNTE À NIB — copiloto conversacional
   ============================================================ */
const ASK_Q = [
  ['Quais cadeias têm maior dependência externa?', ()=>{
    const t=CHAINS.slice().sort((a,b)=>b.dep-a.dep).slice(0,4);
    return {a:`As quatro cadeias com maior dependência externa são: ${t.map(c=>`<b>${esc(c.name)}</b> (${c.dep}%)`).join(', ')}. Juntas concentram ${sum(t.map(c=>c.gaps))} gargalos ativos e ${fmtBRL(sum(projects.filter(p=>t.find(c=>c.id===p.chain)).map(p=>p.capex)))} em projetos vinculados.`,
      cites:['Comex Stat · MOCK','Gêmeo digital das cadeias'],go:'cadeias'};
  }],
  ['Onde estão os maiores riscos da carteira?', ()=>{
    const P=projects.filter(p=>p.risk==='Crítico'||p.risk==='Alto');
    const uf=Object.entries(P.reduce((m,p)=>{m[p.uf]=(m[p.uf]||0)+p.capex;return m},{})).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return {a:`${P.length} projetos estão classificados como risco alto ou crítico, somando ${fmtBRL(sum(P.map(p=>p.capex)))}. A concentração territorial está em ${uf.map(u=>`<b>${u[0]}</b> (${fmtBRL(u[1])})`).join(', ')}.`,
      cites:['Monitor de Investimentos · MOCK','Risk Agent'],go:'pipeline'};
  }],
  ['Qual o impacto de uma ruptura em equipamentos médicos?', ()=>({
    a:`Uma ruptura de 90 dias no elo de insumos críticos expõe cerca de <b>R$ 2,8 bi</b> de produção e <b>18.400</b> empregos, com efeito sobre 4 metas da Missão 2. A mitigação combinada reduz a dependência de 92% para 41% em até 30 meses.`,
    cites:['Scenario Agent · SIMULADO','Decision Workbench'],go:'riscos'}) ],
  ['Quais projetos deveriam ser priorizados agora?', ()=>{
    const P=projects.slice().sort((a,b)=>b.priority-a.priority).slice(0,3);
    return {a:`Os três projetos com maior NIB Priority Score são ${P.map(p=>`<b>${p.id}</b> (${p.priority}/100, ${fmtBRL(p.capex)})`).join(', ')}. Todos atendem gargalos de cadeia com meta associada e prontidão territorial confirmada.`,
      cites:['Project Prioritization Agent'],go:'pipeline'};
  }],
  ['Quais instrumentos se aplicam a um projeto de descarbonização?', ()=>({
    a:`Para projetos com redução de emissões comprovável, os instrumentos mais aderentes são <b>Fundo Clima — Indústria Verde</b>, <b>BNDES Mais Inovação — Produção</b> e <b>Depreciação acelerada</b>. A combinação cobre tipicamente entre 65% e 80% da necessidade, com contrapartida privada complementar.`,
    cites:['Instrument Matcher Agent','Catálogo de instrumentos'],go:'instrumentos'}) ]
];
function askPanel(){
  modal('Copiloto NIB','Pergunte à NIB',`
    <div id="askThread">
      <div class="chat-msg"><div class="av">⬢</div><div class="bb">Posso responder sobre cadeias, dependências, projetos, metas, territórios, instrumentos e riscos — sempre a partir de objetos governados e com as evidências utilizadas. As respostas respeitam os filtros ativos: <b>${esc(filterLabel())}</b>.</div></div>
    </div>
    <div class="sec">Perguntas frequentes</div>
    <div class="wrap">${ASK_Q.map((q,i)=>`<button class="btn sm" data-ask="${i}">${esc(q[0])}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px">
      <input id="askInput" placeholder="Digite sua pergunta…" style="flex:1;border:1px solid var(--line2);border-radius:4px;padding:7px 9px">
      <button class="btn primary" id="askSend">Perguntar</button>
    </div>`,
    `<button class="btn" onclick="modalClose()">Fechar</button>`);
  const ans=(i)=>{
    const q=ASK_Q[i], r=q[1]();
    $('#askThread').insertAdjacentHTML('beforeend',
      `<div class="chat-msg u"><div class="av">SE</div><div class="bb">${esc(q[0])}</div></div>
       <div class="chat-msg"><div class="av">⬢</div><div class="bb">${r.a}
         <div class="cites">${r.cites.map(c=>`<span class="cite">${esc(c)}</span>`).join('')}
         <button class="btn sm tech" onclick="modalClose();go('${r.go}')">Abrir módulo</button></div></div></div>`);
    $('#askThread').scrollTop=99999;
  };
  $$('[data-ask]').forEach(b=> b.onclick=()=>ans(+b.dataset.ask));
  $('#askSend').onclick=()=>{
    const v=$('#askInput').value.trim(); if(!v) return;
    $('#askInput').value='';
    $('#askThread').insertAdjacentHTML('beforeend',
      `<div class="chat-msg u"><div class="av">SE</div><div class="bb">${esc(v)}</div></div>
       <div class="chat-msg"><div class="av">⬢</div><div class="bb">Nesta demonstração o copiloto responde a partir de um conjunto pré-definido de consultas sobre os dados simulados. Em produção, a pergunta seria resolvida por RAG sobre os objetos governados, com citação de fonte e drill-down até a evidência.
       <div class="cites"><span class="cite">Executive Agent</span><span class="cite">Data Hub · MOCK</span></div></div></div>`);
    $('#askThread').scrollTop=99999;
  };
  $('#askInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#askSend').click(); });
}

/* ============================================================
   ROTEADOR E RENDERIZAÇÃO
   ============================================================ */
const VIEWS = {
  torre:[viewTorre,afterTorre], alertas:[viewAlertas,afterAlertas], missoes:[viewMissoes,afterMissoes],
  cadeias:[viewCadeias,afterCadeias], empresas:[viewEmpresas,afterEmpresas], comercio:[viewComercio,afterComercio],
  territorial:[viewTerritorial,afterTerritorial], pipeline:[viewPipeline,afterPipeline], instrumentos:[viewInstrumentos,afterInstrumentos],
  riscos:[viewRiscos,afterRiscos], casos:[viewCasos,afterCasos], decision:[viewDecision,afterDecision],
  resultados:[viewResultados,afterResultados], agents:[viewAgents,afterAgents], relatorios:[viewRelatorios,afterRelatorios],
  admin:[viewAdmin,afterAdmin], blueprint:[viewBlueprint,afterBlueprint]
};
function subActions(){
  const common = `<button class="btn sm" id="saLive">${state.live?'⏸ Pausar eventos':'▶ Retomar eventos'}</button>
    <button class="btn sm" id="saDemo">Roteiro ponta a ponta</button>`;
  const extra = {
    torre:`<button class="btn sm primary" data-report="R01">Executive Brief</button>`,
    cadeias:`<button class="btn sm primary" data-report="R03">Chain Report</button>`,
    comercio:`<button class="btn sm primary" data-report="R04">Dependency Report</button>`,
    territorial:`<button class="btn sm primary" data-report="R07">Territorial Readiness</button>`,
    pipeline:`<button class="btn sm primary" data-report="R05">Investment Pipeline</button>`,
    resultados:`<button class="btn sm primary" data-report="R08">Evidence & Impact</button>`,
    missoes:`<button class="btn sm primary" data-report="R02">Relatório da Missão</button>`
  }[state.view]||'';
  return extra+common;
}
function render(){
  const v=VIEWS[state.view]||VIEWS.torre;
  const meta=VIEW_META[state.view]||['—','—'];
  $('#viewTitle').textContent=meta[0];
  $('#crumb').innerHTML=meta[1].replace(/›/g,'<span style="opacity:.5">›</span>');
  $('#subactions').innerHTML=subActions();
  GEO.park();                       // retira o host do DOM que será descartado
  $('#viewport').innerHTML=v[0]();  // o módulo ativo o remonta em seu próprio quadro
  try{ v[1](); }catch(e){ console.warn('after()',e); }
  renderNav();
  $('#alertCount').textContent=alerts.filter(a=>a.open).length;
  $('#saLive') && ($('#saLive').onclick=toggleLive);
  $('#saDemo') && ($('#saDemo').onclick=demoPanel);
  $$('#subactions [data-report]').forEach(e=> e.onclick=()=>openReport(e.dataset.report));
}
function go(v){
  if(!VIEWS[v]) return;
  state.view=v;
  $('#viewport').scrollTop=0;
  render();
}

function initShell(){
  renderFilters(); renderNav(); render();
  $('#btnCollapse').onclick=()=>{ $('#shell').classList.toggle('collapsed'); setTimeout(()=>{ if(GEO.view) try{GEO.view.container=GEO.host}catch(e){} },220); };
  $('#ctxClose').onclick=ctxClose;
  $('#modalClose').onclick=modalClose;
  $('#scrim').onclick=e=>{ if(e.target.id==='scrim') modalClose(); };
  $('#btnAsk').onclick=askPanel;
  $('#btnAlerts').onclick=()=>go('alertas');
  $('#btnDemo').onclick=()=>{ state.demoRunning? stopDemo() : demoPanel(); };
  $('#liveBox').onclick=toggleLive;
  setInterval(()=>{ $('#clock').textContent=nowHMS(); },1000);
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); askPanel(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='b'){ e.preventDefault(); $('#btnCollapse').click(); }
    if(e.key==='Escape'){ modalClose(); ctxClose(); }
  });
  bus.on('geo:ready',()=>{ renderNav(); if(VIEWS[state.view]) try{VIEWS[state.view][1]()}catch(err){} });
}
seedEvents();
scoreTerritories();
GEO.init();
initShell();
startLive();
setTimeout(()=>{
  toast('info','NIB Intelligence Hub carregado','Ambiente de demonstração com dados simulados. Use o roteiro ponta a ponta para ver a plataforma reagindo de forma sincronizada.',
    `<button class="btn sm primary" onclick="demoPanel()">Executar roteiro</button>`,12000);
},1600);
